[package]
name = "viewer"
description = "Interactive viewer for Solstice scenes, on the desktop and in the browser."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "solstice_viewer"
crate-type = ["cdylib", "rlib"]

# The native viewer always has play mode; only the web's plain build goes without.
[[bin]]
name = "viewer"
path = "src/main.rs"
required-features = ["gameplay"]

# The same with a window and no console: a downloaded game's program (`src/windowed.rs`).
[[bin]]
name = "viewer-windowed"
path = "src/windowed.rs"
required-features = ["gameplay"]

# Play mode: a scene's game, with scripts. On by default; the plain web viewer is built without
# it, so a page that only looks at scenes downloads none of it (docs/gameplay.md, Viewers).
[features]
default = ["gameplay"]
gameplay = ["dep:solstice-game", "dep:serde_json"]
# The editor's page (docs/editor.md): picking, moving instances and the map of what made them.
# Only `editor.html` loads a build with it.
editor = []

[dependencies]
solstice-asset.workspace = true
solstice-game = { workspace = true, optional = true }
solstice-render.workspace = true
# What the game tells its pages (`src/shell.rs`).
serde_json = { workspace = true, optional = true }
glam.workspace = true
log.workspace = true
wgpu.workspace = true

# Wherever the viewer is a program of its own, the desktop or a phone, and not a page.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Sound (`src/sound.rs`).
cpal = "0.18"
# Gamepads on the desktop: the browser build reads them from the page (docs/gameplay.md), and
# on a phone it finds none.
gilrs = "0.11"
png = "0.17"
# The hash a piece of a map is known by, when a game's maps are fetched (`src/fetch.rs`).
sha2 = "0.10"
pollster.workspace = true
# The window, and what is typed and clicked in it (`src/desktop.rs`).
winit = "0.30"

# The desktop alone.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
env_logger = "0.11"
# PlayStation controllers, which Windows shows only as bare HID devices (`src/sony.rs`).
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
# The game's menus and instruments: the same pages the browser shows, in a web view laid over
# the window (`src/overlay.rs`).
wry = "0.57"

# A phone (`src/android.rs`): the window is an activity's, and the rest of the system is
# reached through Java.
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
jni = "0.21"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Response",
    "Window",
] }
